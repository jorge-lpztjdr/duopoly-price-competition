[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-theory-duopoly"
version = "0.1.0"
description = "Price competition in a differentiated duopoly"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.5", "pandas==3.1.1", "pyarrow==26.0.1", "matplotlib==3.11.2"]

[tool.setuptools]
packages = ["duopoly"]
